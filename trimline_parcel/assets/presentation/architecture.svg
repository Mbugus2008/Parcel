<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Arial" stroke="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101728"/>
      <stop offset="100%" stop-color="#1F2A44"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="70" fill="#FFFFFF" font-size="36" font-weight="600" text-anchor="middle">Trimline Parcel Architecture</text>
  <text x="480" y="108" fill="#C7D2FF" font-size="20" text-anchor="middle">High-level data flow across the application</text>
  <g transform="translate(0,0)" fill="#172742" stroke="#3B82F6" stroke-width="2" font-size="18" fill-opacity="0.9">
    <rect x="80" y="150" width="220" height="120" rx="16" filter="url(#shadow)"/>
    <rect x="80" y="320" width="220" height="120" rx="16" filter="url(#shadow)"/>
    <rect x="370" y="210" width="220" height="160" rx="16" filter="url(#shadow)"/>
    <rect x="660" y="150" width="220" height="120" rx="16" filter="url(#shadow)"/>
    <rect x="660" y="320" width="220" height="120" rx="16" filter="url(#shadow)"/>
  </g>
  <g fill="#E8EEFF" font-size="18" font-weight="600">
    <text x="190" y="192" text-anchor="middle">Users &amp; Staff</text>
    <text x="190" y="220" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">Mobile &amp; desktop</text>
    <text x="190" y="362" text-anchor="middle">Device UI</text>
    <text x="190" y="390" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">Widgets &amp; screens</text>
    <text x="480" y="252" text-anchor="middle">GetX Controllers</text>
    <text x="480" y="280" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">State + orchestration</text>
    <text x="480" y="310" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">Search • filters • parcels</text>
    <text x="770" y="192" text-anchor="middle">SQLite Store</text>
    <text x="770" y="220" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">Persistent inventory</text>
    <text x="770" y="362" text-anchor="middle">External APIs</text>
    <text x="770" y="390" fill="#9CA9D9" font-size="15" font-weight="400" text-anchor="middle">Tracking • notifications</text>
  </g>
  <g stroke="#60A5FA" stroke-width="3" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L12,6 L0,12 z" fill="#60A5FA"/>
      </marker>
    </defs>
    <line x1="300" y1="210" x2="370" y2="250"/>
    <line x1="300" y1="350" x2="370" y2="330"/>
    <line x1="590" y1="250" x2="660" y2="210"/>
    <line x1="590" y1="330" x2="660" y2="380"/>
    <line x1="190" y1="270" x2="190" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g fill="#9CA9D9" font-size="14">
    <text x="335" y="234">Commands</text>
    <text x="335" y="368">UI events</text>
    <text x="625" y="234">Queries</text>
    <text x="625" y="368">Sync jobs</text>
  </g>
</svg>
